[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxelmorph-preprocessing-robustness"
version = "0.2.1"
description = "Reproduce, detect, and prevent silent dtype quantization in MRI registration"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [
  { name = "Mobina Mirsharif" }
]
dependencies = [
  "numpy==1.26.4",
  "nibabel==5.4.2",
  "scipy==1.15.3",
  "matplotlib==3.10.9",
  "tensorflow[and-cuda]==2.15.1",
  "voxelmorph @ https://github.com/voxelmorph/voxelmorph/archive/75ac2a2cd7298af3b3d563a3f0cfa000e410d099.zip",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
